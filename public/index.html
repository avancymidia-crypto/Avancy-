<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="description" content="Painel de métricas do Instagram para contas profissionais — alcance, engajamento e crescimento da sua conta.">

<meta name="theme-color" content="#0B0805">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/avancy-mark-beige.svg" type="image/svg+xml">

<body>

<div class="stage">

<script src="/assets/js/app.js"></script>
